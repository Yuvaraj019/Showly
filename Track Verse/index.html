<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#111111"
    >

    <meta
        name="description"
        content="TrackVerse - Game Tracker"
    >

    <title>TrackVerse - Game Tracker</title>


    <!-- ================= CSS ================= -->

    <link
        rel="stylesheet"
        href="./style.css"
    >

</head>


<body>


    <!-- =================================================
         HEADER
    ================================================== -->

    <header class="topbar">

        <div class="logo">
            TRACK<span>VERSE</span>
        </div>


        <div class="header-actions">

            <button
                class="search-button"
                id="searchButton"
                type="button"
                aria-label="Search games"
            >
                🔍
            </button>


            <button
                class="add-button"
                id="addGameButton"
                type="button"
            >
                + Add Game
            </button>

        </div>

    </header>



    <!-- =================================================
         SEARCH
    ================================================== -->

    <section
        class="search-area"
        id="searchArea"
    >

        <input
            type="text"
            id="searchInput"
            placeholder="Search games..."
            autocomplete="off"
        >

    </section>



    <!-- =================================================
         FILTERS
    ================================================== -->

    <nav class="filters">

        <button
            class="filter active"
            data-filter="all"
            type="button"
        >
            ALL
        </button>


        <button
            class="filter"
            data-filter="completed"
            type="button"
        >
            COMPLETED
        </button>


        <button
            class="filter"
            data-filter="playing"
            type="button"
        >
            PLAYING
        </button>


        <button
            class="filter"
            data-filter="backlog"
            type="button"
        >
            BACKLOG
        </button>

    </nav>



    <!-- =================================================
         GAME GRID
    ================================================== -->

    <main>

        <div
            class="game-grid"
            id="gameGrid"
        >

            <!-- Games generated by JavaScript -->

        </div>


        <div
            class="empty-state"
            id="emptyState"
        >

            <div class="empty-icon">
                🎮
            </div>


            <h2>
                No Games Found
            </h2>


            <p>
                Add a game or change your search.
            </p>

        </div>

    </main>



    <!-- =================================================
         GAME DETAILS MODAL
    ================================================== -->

    <div
        class="modal"
        id="detailsModal"
    >

        <div class="modal-content details-content">


            <button
                class="close-button"
                id="closeDetails"
                type="button"
                aria-label="Close details"
            >
                ×
            </button>


            <img
                id="detailsPoster"
                class="details-poster"
                src=""
                alt=""
            >


            <div class="details-info">

                <h1 id="detailsTitle">
                    Game Title
                </h1>


                <div
                    class="details-rating"
                    id="detailsRating"
                >
                    ★ 0.0 / 5
                </div>


                <div class="detail-row">

                    <span>
                        Playtime
                    </span>

                    <strong id="detailsPlaytime">
                        0h 0m
                    </strong>

                </div>


                <div class="detail-row">

                    <span>
                        Completion
                    </span>

                    <strong id="detailsCompletion">
                        0%
                    </strong>

                </div>


                <div class="detail-row">

                    <span>
                        Platform
                    </span>

                    <strong id="detailsPlatform">
                        -
                    </strong>

                </div>


                <div class="detail-row">

                    <span>
                        Status
                    </span>

                    <strong id="detailsStatus">
                        -
                    </strong>

                </div>


                <div class="detail-row">

                    <span>
                        Genre
                    </span>

                    <strong id="detailsGenre">
                        -
                    </strong>

                </div>


                <div class="details-notes">

                    <h3>
                        Notes
                    </h3>

                    <p id="detailsNotes">
                        -
                    </p>

                </div>

            </div>

        </div>

    </div>



    <!-- =================================================
         ADD GAME MODAL
    ================================================== -->

    <div
        class="modal"
        id="addModal"
    >

        <div class="modal-content">


            <button
                class="close-button"
                id="closeAdd"
                type="button"
                aria-label="Close"
            >
                ×
            </button>


            <h2>
                Add Game
            </h2>


            <form id="gameForm">


                <!-- GAME TITLE -->

                <label for="gameTitle">
                    Game Title
                </label>


                <input
                    type="text"
                    id="gameTitle"
                    placeholder="Elden Ring"
                    required
                >



                <!-- POSTER -->

                <label for="gamePoster">
                    Poster Path
                </label>


                <input
                    type="text"
                    id="gamePoster"
                    placeholder="Assets/Games/elden-ring.jpg"
                    required
                >


                <small>
                    Example:
                    Assets/Games/elden-ring.jpg
                </small>



                <!-- RATING + COMPLETION -->

                <div class="two-inputs">


                    <div>

                        <label for="gameRating">
                            Rating
                        </label>


                        <input
                            type="number"
                            id="gameRating"
                            min="0"
                            max="5"
                            step="0.1"
                            placeholder="4.8"
                            required
                        >

                    </div>


                    <div>

                        <label for="gameCompletion">
                            Completion %
                        </label>


                        <input
                            type="number"
                            id="gameCompletion"
                            min="0"
                            max="100"
                            placeholder="100"
                            required
                        >

                    </div>

                </div>



                <!-- HOURS + MINUTES -->

                <div class="two-inputs">


                    <div>

                        <label for="gameHours">
                            Hours
                        </label>


                        <input
                            type="number"
                            id="gameHours"
                            min="0"
                            placeholder="10"
                            required
                        >

                    </div>


                    <div>

                        <label for="gameMinutes">
                            Minutes
                        </label>


                        <input
                            type="number"
                            id="gameMinutes"
                            min="0"
                            max="59"
                            placeholder="30"
                            required
                        >

                    </div>

                </div>



                <!-- PLATFORM -->

                <label for="gamePlatform">
                    Platform
                </label>


                <select id="gamePlatform">

                    <option value="PC">
                        PC
                    </option>

                    <option value="PS5">
                        PS5
                    </option>

                    <option value="PS4">
                        PS4
                    </option>

                    <option value="Xbox Series X/S">
                        Xbox Series X/S
                    </option>

                    <option value="Xbox One">
                        Xbox One
                    </option>

                    <option value="Switch">
                        Switch
                    </option>

                </select>



                <!-- STATUS -->

                <label for="gameStatus">
                    Status
                </label>


                <select id="gameStatus">

                    <option value="completed">
                        Completed
                    </option>

                    <option value="playing">
                        Playing
                    </option>

                    <option value="backlog">
                        Backlog
                    </option>

                </select>



                <!-- GENRE -->

                <label for="gameGenre">
                    Genre
                </label>


                <input
                    type="text"
                    id="gameGenre"
                    placeholder="Action RPG"
                >



                <!-- NOTES -->

                <label for="gameNotes">
                    Notes
                </label>


                <textarea
                    id="gameNotes"
                    placeholder="Your thoughts about the game..."
                ></textarea>



                <!-- SAVE -->

                <button
                    type="submit"
                    class="save-button"
                >
                    SAVE GAME
                </button>


            </form>

        </div>

    </div>



    <!-- =================================================
         BOTTOM NAVIGATION
    ================================================== -->

    <nav class="bottom-nav">


        <button
            class="bottom-item active"
            type="button"
        >

            <span>
                ⌂
            </span>

            HOME

        </button>



        <button
            class="bottom-item"
            id="statsButton"
            type="button"
        >

            <span>
                ◈
            </span>

            STATS

        </button>



        <button
            class="bottom-item"
            type="button"
        >

            <span>
                ⚙
            </span>

            SETTINGS

        </button>


    </nav>



    <!-- =================================================
         JAVASCRIPT
    ================================================== -->

    <script
        src="./script.js"
        defer
    ></script>


</body>

</html>
